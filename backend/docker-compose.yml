version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vetrion_postgres
    restart: always
    environment:
      POSTGRES_DB: vetrion_db
      POSTGRES_USER: vetrion_user
      POSTGRES_PASSWORD: vetrion_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vetrion_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: vetrion_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-vetrion-build-guide-prod-key-2026
      - DATABASE_URL=postgres://vetrion_user:vetrion_secure_password_2026@db:5432/vetrion_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
